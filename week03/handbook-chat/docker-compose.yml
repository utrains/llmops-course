services:
  handbook-chat:
    build:
      context: ..
      dockerfile: handbook-chat/Dockerfile
    ports:
      # host:container. Open http://localhost:8501 in your browser.
      - "8501:8501"
    # Reads this folder's .env and puts the keys in the container.
    # The .env file itself is not copied into the image (.dockerignore).
    env_file:
      - .env
